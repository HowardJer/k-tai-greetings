<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seasonal Greetings from K-Tai</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <canvas id="winter-scene"></canvas>

    <main class="greeting">

        <header class="company">
            <h1>K-Tai</h1>
            <p>The Company That Has Gone to the Dogs</p>
        </header>

        <section class="message">
            <h2>Happy Howlidays!</h2>

            <p>
                We hope you paws to enjoy the season,<br>
                filled with warm hearts, wet noses<br>
                and wagging tails.
            </p>
        </section>

        <footer class="signature">
            <p>From all of us at K-Tai</p>
            <p>The Board of Directors</p>
        </footer>

    </main>

</body>

</html>
